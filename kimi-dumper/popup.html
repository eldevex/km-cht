<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 340px; background: #0f1117; color: #e4e6eb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; }
.header { padding: 14px 16px; border-bottom: 1px solid #232634; } .header h1 { font-size: 15px; font-weight: 600; }
.body { padding: 16px; }
.stat { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; color: #9aa0ac; border-bottom: 1px solid #1a1d28; }
.stat:last-of-type { border-bottom: none; } .stat b { color: #e4e6eb; font-weight: 500; }
button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
.primary { background: linear-gradient(135deg, #7c8cff, #a78bfa); color: #fff; }
.secondary { background: #1f2230; color: #e4e6eb; border: 1px solid #2e3344; }
button:disabled { opacity: 0.5; }
.status { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 12px; display: none; }
.status.ok { background: rgba(74,222,128,0.1); color: #4ade80; display: block; }
.status.err { background: rgba(248,113,113,0.1); color: #f87171; display: block; }
.hint { color: #6b7280; font-size: 11px; margin-top: 12px; line-height: 1.5; }
</style></head><body>
<div class="header"><h1>Kimi Full Dumper</h1></div>
<div class="body">
<div class="stat"><span>access_token</span><b id="s-tok">—</b></div>
<div class="stat"><span>refresh_token</span><b id="s-rtok">—</b></div>
<div class="stat"><span>Перехвачено</span><b id="s-req">—</b></div>
<button class="primary" id="b-dump">Снять дамп</button>
<button class="secondary" id="b-ref">Обновить</button>
<button class="secondary" id="b-clr">Очистить буфер</button>
<div class="status" id="st"></div>
</div><script src="popup.js"></script></body></html>
